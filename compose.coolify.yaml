# Every service name is prefixed with "rag-": Coolify attaches every container
# of a Docker Compose resource to the shared destination network when "Connect
# To Predefined Network" is enabled, and it does not alter the Compose file
# (coollabsio/coolify#5597). An unprefixed name such as "postgres" collides with
# Coolify's own coolify-db container on that network, and Docker DNS
# round-robins between them (coollabsio/coolify#5160). Coolify's documented
# mitigation is that "Names can be prefixed to prevent collisions". Do NOT add a
# networks: section instead: Coolify's proxy only joins the resource-specific
# network, so custom networks cause intermittent HTTPS outages
# (https://coolify.io/docs/applications/build-packs/docker-compose).
services:
  rag-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  rag-model-download:
    image: curlimages/curl@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
    user: "0:0"
    entrypoint: ["/bin/sh", "/scripts/download-llamacpp-model.sh"]
    read_only: true
    volumes:
      - llama-cpp-model:/models
      # Directory mount, not a single-file bind: Docker auto-creates a missing
      # single-file bind source as a directory before the repository checkout,
      # which left this mount empty in the first production deployment while
      # rag-model-download exited 0 having published nothing.
      - ./scripts:/scripts:ro
    restart: "no"

  rag-llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp@sha256:c005e79321f8e5731ec49a7f736aaeaac9465926c1e8f4c199c1d8a8996f26ef
    command:
      ["--model", "/models/Qwen3-Embedding-0.6B-Q8_0.gguf", "--embedding", "--pooling", "last", "--embd-normalize", "2", "--device", "none", "--offline", "--host", "0.0.0.0", "--port", "8080"]
    read_only: true
    volumes:
      - llama-cpp-model:/models:ro
    depends_on:
      rag-model-download:
        condition: service_completed_successfully
    restart: unless-stopped

  rag-migrate:
    image: ghcr.io/jesusjbriceno/rag-operator${RAG_OPERATOR_IMAGE_REFERENCE}
    pull_policy: always
    command: ["migrate"]
    environment: &rag-environment
      ConnectionStrings__Rag: Host=rag-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ContentStore__RootPath: /app/content
      LlamaCpp__BaseUrl: http://rag-llama-cpp:8080/
      Jwt__Issuer: ${JWT__ISSUER}
      Jwt__Audience: ${JWT__AUDIENCE}
      Jwt__CurrentSigningKey__KeyId: ${JWT__CURRENT_SIGNING_KEY__KEY_ID}
      Jwt__CurrentSigningKey__PrivateKeyPem: ${JWT__CURRENT_SIGNING_KEY__PRIVATE_KEY_PEM}
      Jwt__ValidationKeys__0__KeyId: ${JWT__VALIDATION_KEYS__0__KEY_ID}
      Jwt__ValidationKeys__0__PublicKeyPem: ${JWT__VALIDATION_KEYS__0__PUBLIC_KEY_PEM}
    depends_on:
      rag-postgres:
        condition: service_healthy
    restart: "no"

  rag-api:
    image: ghcr.io/jesusjbriceno/rag-api${RAG_API_IMAGE_REFERENCE}
    pull_policy: always
    # The admin plane is off unless deployment configuration explicitly enables it
    # (ADMINPLANE__ENABLED=true). When enabled, the API validates the admin machine-proof
    # and assertion trust material at startup and refuses to start if it is missing.
    environment:
      <<: *rag-environment
      AdminPlane__Enabled: ${ADMINPLANE__ENABLED:-false}
      # Retention keeps the admin audit trail and the operation journal bounded. The API
      # validates these at startup when the plane is enabled and refuses to start when
      # they are invalid, so deployment defaults live here rather than relying on image
      # defaults that a deployment environment can silently blank out.
      AdminAudit__RetentionMode: ${ADMINAUDIT__RETENTION_MODE:-days}
      AdminAudit__RetentionDays: ${ADMINAUDIT__RETENTION_DAYS:-90}
      AdminOperations__RetentionHours: ${ADMINOPERATIONS__RETENTION_HOURS:-720}
      AdminAppAuth__Apps__0__AppId: ${ADMINAPPAUTH__APPS__0__APP_ID:-}
      AdminAppAuth__Apps__0__KeyId: ${ADMINAPPAUTH__APPS__0__KEY_ID:-}
      AdminAppAuth__Apps__0__CurrentSecret: ${ADMINAPPAUTH__APPS__0__CURRENT_SECRET:-}
      AdminAppAuth__Apps__0__PreviousSecret: ${ADMINAPPAUTH__APPS__0__PREVIOUS_SECRET:-}
      AdminAssertion__Issuer: ${ADMINASSERTION__ISSUER:-}
      AdminAssertion__Audience: ${ADMINASSERTION__AUDIENCE:-}
      AdminAssertion__ValidationKeys__0__KeyId: ${ADMINASSERTION__VALIDATION_KEYS__0__KEY_ID:-}
      AdminAssertion__ValidationKeys__0__PublicKeyPem: ${ADMINASSERTION__VALIDATION_KEYS__0__PUBLIC_KEY_PEM:-}
    volumes:
      - rag-content:/app/content
    depends_on:
      rag-migrate:
        condition: service_completed_successfully
      rag-llama-cpp:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Admin BFF + SPA host. Private service only: no ports are published; exposure is via
  # the Coolify proxy/domain and the Cloudflare Access boundary in front of it. Every
  # operator-supplied trust value (allowed origin, allowlisted Cloudflare subjects,
  # Cloudflare Access keys, upstream signing credentials, assertion signing key) fails
  # closed at startup when missing or empty — the host never serves the admin surface
  # unconfigured. The image reference follows the API release train by default
  # (RAG_ADMINAPP_IMAGE_REFERENCE may override it once the admin image is published).
  rag-adminapp:
    image: ghcr.io/jesusjbriceno/rag-adminapp${RAG_ADMINAPP_IMAGE_REFERENCE:-${RAG_API_IMAGE_REFERENCE}}
    pull_policy: always
    environment:
      AdminBff__UpstreamBaseUrl: http://rag-api:8080/
      AdminBff__SpaRoot: /app/wwwroot
      AdminBff__AllowedOrigin: ${ADMINBFF__ALLOWED_ORIGIN:-}
      AdminBff__AllowedSubjects__0: ${ADMINBFF__ALLOWED_SUBJECTS__0:-}
      AdminBff__Signing__AppId: ${ADMINBFF__SIGNING__APP_ID:-}
      AdminBff__Signing__KeyId: ${ADMINBFF__SIGNING__KEY_ID:-}
      AdminBff__Signing__MachineSecret: ${ADMINBFF__SIGNING__MACHINE_SECRET:-}
      CloudflareAccess__Issuer: ${CLOUDFLAREACCESS__ISSUER:-}
      CloudflareAccess__Audience: ${CLOUDFLAREACCESS__AUDIENCE:-}
      CloudflareAccess__Keys__0__KeyId: ${CLOUDFLAREACCESS__KEYS__0__KEY_ID:-}
      CloudflareAccess__Keys__0__PublicKeyPem: ${CLOUDFLAREACCESS__KEYS__0__PUBLIC_KEY_PEM:-}
      AdminAssertion__Issuer: ${ADMINASSERTION__ISSUER:-}
      AdminAssertion__Audience: ${ADMINASSERTION__AUDIENCE:-}
      AdminAssertion__AppId: ${ADMINBFF__SIGNING__APP_ID:-}
      AdminAssertion__KeyId: ${ADMINBFF__SIGNING__KEY_ID:-}
      AdminAssertion__PrivateKeyPem: ${ADMINASSERTION__PRIVATE_KEY_PEM:-}
    depends_on:
      rag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  llama-cpp-model:
  rag-content:
