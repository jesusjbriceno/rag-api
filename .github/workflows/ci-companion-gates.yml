name: ci-companion-gates

# Companion live gates, run manually. These gates prove the live BFF
# companion contract and a clean-machine 4-format smoke (txt, md, docx, pdf)
# against the deployed API. They need the seven COMPANION_* secrets
# (COMPANION_BFF_URL, COMPANION_ID, COMPANION_KEY_ID, COMPANION_SECRET,
# COMPANION_API_BASE_URL, COMPANION_SERVICE_CLIENT_KEY_ID,
# COMPANION_SERVICE_CLIENT_SECRET) plus a reachable BFF and API.
#
# They were removed from the ci-release.yml release path because they
# blocked every release: the secrets and the live environment are not part
# of the current delivery. Re-add them to `release.needs` in ci-release.yml
# once the companion environment exists.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build companion for gates (win-x64)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Publish companion (win-x64, self-contained, single-file)
        run: dotnet publish src/Rag.Companion/Rag.Companion.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o "$env:RUNNER_TEMP\publish"

      - name: Upload companion build for gates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rag-companion-gates-win-x64
          path: ${{ runner.temp }}/publish/**
          if-no-files-found: error
          retention-days: 1

  companion-bff-smoke:
    name: Verify live BFF companion contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COMPANION_BFF_URL: ${{ secrets.COMPANION_BFF_URL }}
      COMPANION_ID: ${{ secrets.COMPANION_ID }}
      COMPANION_KEY_ID: ${{ secrets.COMPANION_KEY_ID }}
      COMPANION_SECRET: ${{ secrets.COMPANION_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Run companion BFF contract smoke
        run: bash scripts/companion-bff-smoke.sh

  companion-format-smoke:
    name: Clean-machine 4-format smoke
    needs:
      - build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPANION_BFF_URL: ${{ secrets.COMPANION_BFF_URL }}
      COMPANION_ID: ${{ secrets.COMPANION_ID }}
      COMPANION_KEY_ID: ${{ secrets.COMPANION_KEY_ID }}
      COMPANION_SECRET: ${{ secrets.COMPANION_SECRET }}
      COMPANION_API_BASE_URL: ${{ secrets.COMPANION_API_BASE_URL }}
      COMPANION_SERVICE_CLIENT_KEY_ID: ${{ secrets.COMPANION_SERVICE_CLIENT_KEY_ID }}
      COMPANION_SERVICE_CLIENT_SECRET: ${{ secrets.COMPANION_SERVICE_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download companion build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rag-companion-gates-win-x64
          path: ${{ runner.temp }}/companion/bin

      - name: Run 4-format smoke (txt, md, docx, pdf)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $companionDir = "$env:RUNNER_TEMP\companion"
          $smokeDir = "$env:RUNNER_TEMP\smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Copy-Item tests/fixtures/import/sample.txt $smokeDir
          Copy-Item tests/fixtures/import/sample.md $smokeDir
          Copy-Item tests/fixtures/import/sample.docx $smokeDir
          Copy-Item tests/fixtures/import/sample.pdf $smokeDir
          $config = @{
            apiBaseUrl = $env:COMPANION_API_BASE_URL
            companionBaseUrl = $env:COMPANION_BFF_URL
            companionId = $env:COMPANION_ID
            companionKeyId = $env:COMPANION_KEY_ID
            companionSecret = $env:COMPANION_SECRET
            serviceClientKeyId = $env:COMPANION_SERVICE_CLIENT_KEY_ID
            serviceClientSecret = $env:COMPANION_SERVICE_CLIENT_SECRET
            roots = @($smokeDir)
            failureLogPath = "$env:RUNNER_TEMP\smoke-failures.jsonl"
          }
          $config | ConvertTo-Json | Set-Content -Path "$env:RUNNER_TEMP\smoke.json" -Encoding UTF8
          & "$companionDir\bin\Rag.Companion.exe" run --config "$env:RUNNER_TEMP\smoke.json"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP\smoke-failures.jsonl" -ErrorAction SilentlyContinue
            throw "4-format smoke failed with exit code $LASTEXITCODE"
          }
          Write-Host '4-format smoke passed: txt, md, docx, pdf all extracted and ingested.'
