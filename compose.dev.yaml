# Local-only overlay for compose.coolify.yaml. Service keys must stay in sync
# with the prefixed names in the production Compose file (see the header of
# compose.coolify.yaml for why every service is prefixed with "rag-").
services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    pull_policy: build
    ports:
      - 127.0.0.1:${RAG_API_PORT:-8080}:8080

  rag-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: operator
    pull_policy: build
